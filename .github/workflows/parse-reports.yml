name: 경제 보고서 분석

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: parse-reports
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: PDF 도구 설치
        run: npm install --no-save pdfjs-dist@2.16.105

      - name: reports 폴더의 PDF 분석
        run: node scripts/parse_reports.js

      - name: 바뀐 내용 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요"
          else
            git commit -m "경제 보고서 반영 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

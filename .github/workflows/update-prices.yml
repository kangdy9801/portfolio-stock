name: 주가 자동 업데이트

on:
  schedule:
    # 한국장 마감 후: 평일 16:30 KST (= 07:30 UTC)
    - cron: "30 7 * * 1-5"
    # 미국장 마감 후: 화~토 07:30 KST (= 22:30 UTC, 월~금)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow"로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests yfinance

      - name: 시세 받아오기
        run: python scripts/update_prices.py

      - name: 바뀐 내용 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "바뀐 시세가 없어요"
          else
            git commit -m "시세 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
